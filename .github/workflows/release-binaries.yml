# Build standalone ccs-plus binaries after the wheel release workflow succeeds.
#
# Trigger:
#   - successful Release wheel run for a version tag
#   - workflow_dispatch (manual rebuild for a tag)
#
# Artifacts are uploaded onto the release as:
#   ccs-plus-linux-x86_64
#   ccs-plus-macos-arm64
#   ccs-plus-windows-x86_64.exe

name: Release binaries

on:
  workflow_run:
    workflows: ["Release wheel"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: ccs-plus-linux-x86_64
            ext: ""
          - os: macos-14
            artifact: ccs-plus-macos-arm64
            ext: ""
          - os: windows-2022
            artifact: ccs-plus-windows-x86_64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify checked out tag
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          if [[ -n "$EXPECTED_SHA" ]]; then
            test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Sync project
        run: uv sync --all-groups --locked

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          ENTRY="src/ccs_plus/__main__.py"
          NAME="ccs-plus"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            data_separator=";"
          else
            data_separator=":"
          fi
          uv run --locked --no-sync pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name "${NAME}" \
            --paths src \
            --add-data "settings.yaml${data_separator}." \
            --hidden-import ccs_plus \
            --hidden-import ccs_plus.cli \
            --hidden-import ccs_plus.tui \
            --hidden-import ccs_plus.sessions \
            --collect-all prompt_toolkit \
            --collect-all dynaconf \
            --collect-submodules ccs_plus \
            "${ENTRY}"

          mkdir -p dist/release
          src="dist/${NAME}${{ matrix.ext }}"
          dst="dist/release/${{ matrix.artifact }}${{ matrix.ext }}"
          if [[ ! -f "${src}" ]]; then
            echo "Expected binary missing: ${src}" >&2
            ls -la dist || true
            exit 1
          fi
          cp "${src}" "${dst}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "${dst}"
          fi
          ls -lh "${dst}"

      - name: Smoke test binary
        shell: bash
        run: |
          set -euo pipefail
          bin="dist/release/${{ matrix.artifact }}${{ matrix.ext }}"
          "${bin}" --help | head -20

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/${{ matrix.artifact }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -lah artifacts

      - name: Verify GitHub Release exists
        shell: bash
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Upload assets to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            artifacts/ccs-plus-linux-x86_64 \
            artifacts/ccs-plus-macos-arm64 \
            artifacts/ccs-plus-windows-x86_64.exe \
            --repo "$GITHUB_REPOSITORY" --clobber
