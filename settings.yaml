# ccs-plus configuration
#
# Environment overrides use CCS_PLUS_ and nested __ separators, e.g.:
#   CCS_PLUS_DATABASE__PATH
#   CCS_PLUS_APPS__CODEX__HOME
#   CCS_PLUS_ENCRYPTION_KEY

# cc-switch SQLite database. ~ expands on Windows, macOS, and Linux.
database:
  path: "~/.cc-switch/cc-switch.db"

# Fernet key for providers export/import. Prefer setting via .env.
encryption_key: ""

# Global network proxy for all launched CLIs. An empty value clears inherited proxies.
proxy: ""

# Per-app runtime homes and launch settings.
# Launch uses permission values in a provider record when present; otherwise it falls
# back to the matching app values below. Codex values also seed newly added/imported providers.
apps:
  claude:
    home: data/claude
    permission_mode: bypassPermissions
    visibility:
      # User-home extension policy for the isolated runtime. Directories are
      # linked entry-by-entry; named files can instead be copied or skipped.
      mcp_key: mcpServers
      skills: {}
      plugins:
        copy:
          - .last_inuse_sweep
          - blocklist.json
          - installed_plugins.json
          - known_marketplaces.json
        skip:
          - plugin-catalog-cache.json
  codex:
    home: data/codex
    session_model_provider: ccs-plus-managed
    approval_policy: never
    sandbox_mode: danger-full-access
    visibility:
      profile_extension_keys:
        - mcp_servers
        - plugins
        - marketplaces
        - shell_environment_policy
      skills:
        skip:
          - .system
      plugins:
        skip:
          - .plugin-appserver
          - .remote-plugin-install-staging
  grok:
    home: data/grok
    sandbox_mode: workspace
    always_approve: true
    visibility:
      extension_keys:
        - mcp_servers
        - skills
        - plugins
        - marketplace
        - hooks
      skills: {}
      plugins: {}
      hooks:
        copy:
          - orca-status.json
      installed_plugins:
        copy:
          - registry.json
  opencode:
    # Isolated XDG parent: data + config live under home/{share,config}/opencode.
    home: data/opencode
    permission_mode: allow
    always_approve: false
