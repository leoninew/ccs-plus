# ccs-plus configuration
#
# Environment overrides use CCS_PLUS_ and nested __ separators, e.g.:
#   CCS_PLUS_DATABASE__PATH
#   CCS_PLUS_APPS__CODEX__HOME
#   CCS_PLUS_ENCRYPTION_KEY

# cc-switch SQLite database. ~ expands on Windows, macOS, and Linux.
database:
  path: "~/.cc-switch/cc-switch.db"

# Fernet key for providers export/import. Prefer setting via .env.
encryption_key: ""

# Global network proxy for all launched CLIs. An empty value clears inherited proxies.
proxy: ""

# Per-app runtime homes and launch settings.
# Launch uses permission values in a provider record when present; otherwise it falls
# back to the matching app values below. Codex values also seed newly added/imported providers.
apps:
  claude:
    home: data/claude
    permission_mode: bypassPermissions
    # Plugin entries shared into the isolated state home. Directories are always
    # linked (junctions); these names control files only. "copy" files are copied
    # from the real home on each launch (their contents point back there by
    # absolute path, so a copy needs no symlink privilege); "skip" files are left
    # to the isolated run (regenerable cache).
    plugins:
      copy:
        - .last_inuse_sweep
        - blocklist.json
        - installed_plugins.json
        - known_marketplaces.json
      skip:
        - plugin-catalog-cache.json
  codex:
    home: data/codex
    session_model_provider: ccs-plus-managed
    approval_policy: never
    sandbox_mode: danger-full-access
  grok:
    home: data/grok
    sandbox_mode: workspace
    always_approve: true
