# ccs-plus configuration
#
# Environment overrides use CCS_PLUS_ and nested __ separators, e.g.:
#   CCS_PLUS_DATABASE__PATH
#   CCS_PLUS_APPS__CODEX__HOME
#   CCS_PLUS_ENCRYPTION_KEY

# cc-switch SQLite database. ~ expands on Windows, macOS, and Linux.
database:
  path: "~/.cc-switch/cc-switch.db"

# Fernet key for providers export/import. Prefer setting via .env.
encryption_key: ""

# Per-app runtime homes and launch settings.
# Codex approval/sandbox values are defaults for newly added or imported providers;
# launch uses the provider record stored in the database for provider-specific settings.
apps:
  claude:
    home: data/claude
    permission_mode: bypassPermissions
  codex:
    home: data/codex
    session_model_provider: ccs-plus-managed
    approval_policy: never
    sandbox_mode: danger-full-access
  grok:
    home: data/grok
    sandbox_mode: workspace
    always_approve: true
