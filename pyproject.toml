[project]
name = "ccs-plus"
version = "0.1.0"
description = "ccs-plus provider manager and CLI launcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4,<9",
    "cryptography>=50.0.0",
    "dynaconf>=3.3,<4",
    "portalocker>=3.2,<4",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0.3",
    "rich>=14,<15",
    "tomlkit>=0.15,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.16,<1",
]

[project.scripts]
ccs-plus = "ccs_plus.cli:main"
ccsp = "ccs_plus.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["dynaconf"]
ignore_missing_imports = true
